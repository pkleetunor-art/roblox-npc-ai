databases:
  - name: roblox-npc-ai-db
    databaseName: roblox_npc_ai
    user: roblox_npc_ai

services:
  - type: web
    name: roblox-npc-ai-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roblox-npc-ai-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: BACKEND_AUTH_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: AUTO_MIGRATE
        value: "true"
